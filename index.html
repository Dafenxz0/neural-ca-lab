<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural-CA Lab — WebGL2 Lenia &amp; Self-Healing Morphogenetic Automata</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="sim-canvas" aria-label="Neural Cellular Automata WebGL2 Viewport"></canvas>

    <header class="telemetry-bar" aria-label="Simulation Telemetry">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <span class="brand-title">NEURAL-CA LAB</span>
        <span id="mode-badge" class="mode-badge">LENIA</span>
      </div>

      <div class="telemetry-metrics">
        <div class="metric">
          <span class="metric-label">FPS</span>
          <span id="stat-fps" class="metric-value">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">MASS</span>
          <span id="stat-mass" class="metric-value">0.0%</span>
        </div>
        <div class="metric">
          <span class="metric-label">STEP</span>
          <span id="stat-step" class="metric-value">0</span>
        </div>
        <div class="metric">
          <span class="metric-label">GRID</span>
          <span id="stat-grid" class="metric-value">256×256</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-toggle-panel" class="icon-btn" type="button" title="Toggle Lab Console (H)">
          Console
        </button>
      </div>
    </header>

    <aside id="control-panel" class="control-panel" aria-label="Laboratory Controls">
      <section class="panel-section">
        <div class="section-head">
          <span class="section-title">SPECIMEN PRESET</span>
          <span id="preset-tag" class="section-meta">1 / 5</span>
        </div>
        <div id="preset-list" class="preset-grid" role="radiogroup" aria-label="Presets"></div>
        <p id="preset-desc" class="preset-desc"></p>
      </section>

      <section class="panel-section">
        <div class="section-head">
          <span class="section-title">MICROMANIPULATOR</span>
          <span id="brush-readout" class="section-meta">R=16px</span>
        </div>
        <div class="tool-row">
          <button id="tool-seed" class="tool-btn active" type="button" data-tool="seed">
            Seed / Spawn
          </button>
          <button id="tool-slice" class="tool-btn slice" type="button" data-tool="slice">
            Slice / Damage
          </button>
        </div>
        <label class="slider-row" for="slider-radius">
          <span class="slider-label">Brush Radius</span>
          <input id="slider-radius" type="range" min="4" max="44" step="1" value="16" />
          <span id="val-radius" class="slider-val">16</span>
        </label>
      </section>

      <section class="panel-section">
        <div class="section-head">
          <span class="section-title">DNA / KERNEL MUTATOR</span>
          <button id="btn-restore-dna" class="mini-btn" type="button" title="Restore preset defaults">
            Default
          </button>
        </div>

        <label class="slider-row" for="slider-mu">
          <span class="slider-label">&mu; Center</span>
          <input id="slider-mu" type="range" min="0.05" max="0.50" step="0.002" value="0.15" />
          <span id="val-mu" class="slider-val">0.150</span>
        </label>

        <label class="slider-row" for="slider-sigma">
          <span class="slider-label">&sigma; Width</span>
          <input id="slider-sigma" type="range" min="0.005" max="0.120" step="0.001" value="0.017" />
          <span id="val-sigma" class="slider-val">0.017</span>
        </label>

        <label class="slider-row" for="slider-dt">
          <span class="slider-label">dt Rate</span>
          <input id="slider-dt" type="range" min="0.01" max="0.35" step="0.005" value="0.10" />
          <span id="val-dt" class="slider-val">0.100</span>
        </label>

        <label class="select-row" for="select-palette">
          <span class="slider-label">Optics</span>
          <select id="select-palette">
            <option value="0">Bioluminescent</option>
            <option value="1">Viridis</option>
            <option value="2">Thermal</option>
            <option value="3">Phase Contrast</option>
            <option value="4">Cellular RGB</option>
          </select>
        </label>
      </section>

      <section class="panel-section transport-section">
        <div class="transport-row">
          <button id="btn-play" class="action-btn primary" type="button">Pause</button>
          <button id="btn-step" class="action-btn" type="button">Step</button>
          <button id="btn-reset" class="action-btn" type="button">Reset</button>
          <button id="btn-clear" class="action-btn" type="button">Clear</button>
        </div>
        <div class="shortcuts-line">
          <span><kbd>Space</kbd> Play</span>
          <span><kbd>S</kbd> Step</span>
          <span><kbd>R</kbd> Reset</span>
          <span><kbd>1-5</kbd> Specimen</span>
        </div>
      </section>
    </aside>

    <div id="error-banner" class="error-banner hidden" role="alert"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
